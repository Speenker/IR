storage:
  data_dir: "data"
  raw_html_dir: "data/raw_html"
  meta_dir: "data/meta"
  extract_text: false
  text_dir: "data/text"
  manifest_path: "data/manifest.csv"
  normalize_to_utf8: true

deduplication:
  enabled: true
  url_normalization:
    drop_fragment: true
    drop_query: false
  content_hash:
    algorithm: "sha256"
    mode: "text"

